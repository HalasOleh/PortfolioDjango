{% extends "base.html" %}

{% block title %}Вхід{% endblock %}

{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-sm">
        <div class="card-body">
          <h2 class="card-title mb-4">Увійти</h2>

          <form method="post">
            {% csrf_token %}

            {% for field in form %}
              <div class="mb-3">
                <label for="{{ field.id_for_label }}" class="form-label fw-semibold">
                  {{ field.label }}
                </label>
                {{ field }}
                {% if field.errors %}
                  <div class="text-danger small mt-1">
                    {% for error in field.errors %}
                      <div>{{ error }}</div>
                    {% endfor %}
                  </div>
                {% endif %}
              </div>
            {% endfor %}

            <button type="submit" class="btn btn-primary w-100 mt-2">
              Увійти
            </button>
          </form>

          <hr>
          <p class="text-center mb-0">
            Ще немає акаунту?
            <a href="{% url 'movie_watchlist:register' %}">Зареєструватись</a>
          </p>

        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
