{% extends "base.html" %}

{% block title %}Видалити фільм{% endblock %}

{% block content %}
<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card border-danger shadow-sm">
        <div class="card-body text-center">

          <h2 class="card-title text-danger mb-3">🗑 Видалити фільм?</h2>
          <p class="mb-4">
            Ви впевнені, що хочете видалити
            <strong>{{ movie.title }}</strong>?
            Цю дію неможливо скасувати.
          </p>

          <form method="post">
            {% csrf_token %}
            <div class="d-flex justify-content-center gap-3">
              <button type="submit" class="btn btn-danger">
                Так, видалити
              </button>
              <a href="{% url 'movie_watchlist:movie_list' %}" class="btn btn-secondary">
                Скасувати
              </a>
            </div>
          </form>

        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
